version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       chronogrid
      POSTGRES_USER:     cg_user
      POSTGRES_PASSWORD: cg_secret
    ports:
      - "5432:5432"
    volumes:
      - cg-pg-data:/var/lib/postgresql/data
      - ./packages/cg-storage/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cg-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@chronogrid.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  cg-pg-data:
