name: ChronoGrid Normative Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  normative-level2:
    name: Level 2 - 193 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: monorepo/pnpm-lock.yaml
      - name: Install
        working-directory: monorepo
        run: pnpm install --no-frozen-lockfile
      - name: Run Level 2
        working-directory: monorepo/packages/cg-testkit
        run: node --import tsx/esm src/cli.ts --level 2

  cgua-vitest:
    name: CGUA Vitest - 28 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: monorepo/pnpm-lock.yaml
      - name: Install
        working-directory: monorepo
        run: pnpm install --no-frozen-lockfile
      - name: Run Vitest
        working-directory: monorepo/packages/cg-cguas
        run: npx vitest run --globals src/cgua.test.ts
