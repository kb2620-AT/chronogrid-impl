name: Lean 4 Verification (ChronoGrid formal)

on:
  workflow_dispatch:
  push:
    paths:
      - 'formal/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'formal/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        run: ~/.elan/bin/lake exe cache get

      - name: Build (lake build)
        run: ~/.elan/bin/lake build

      - name: "Print axioms (Nachweis: kein sorry)"
        run: |
          set -o pipefail
          {
            ~/.elan/bin/lake env lean Chronogrid/Basic.lean
            ~/.elan/bin/lake env lean Chronogrid/Mapping.lean
          } | tee verification-log.txt

      - name: Upload verification log
        uses: actions/upload-artifact@v4
        with:
          name: verification-log
          path: formal/verification-log.txt
