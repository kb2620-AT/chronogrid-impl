  # ── SEGMENTS / CGUAS ───────────────────────────────────────────────────────

  - id: T-API-046
    level: 3
    group: segments
    title: "Segment registrieren: 201 Created mit korrekten Adressen"
    description: >
      POST /v1/segments muss ein neues Segment mit start_address,
      end_address und size_ns als BigInt-Strings zurückgeben.
    request:
      method: POST
      path: /v1/segments
      auth: bearer
      role: contributor
      body:
        owner_id: "test.chronogrid.org"
        size_ns: "1000000000000000"
        level: 4
    expect:
      status: 201
      body:
        segment_id: { type: string }
        start_address: { type: string, pattern: "^[0-9]+$" }
        end_address: { type: string, pattern: "^[0-9]+$" }
        size_ns: { const: "1000000000000000" }
        granted_at: { pattern: "^CG:TAI:[0-9]+/v[0-9]+$" }
    invariants: [I-SEG-1]
    normref: "CG-STD-4100 Kap. 4.6, CG-STD-6100 Teil A"

  - id: T-API-047
    level: 3
    group: segments
    title: "I-SEG-1: Segmente überschneiden sich nicht"
    description: >
      Zwei gleichzeitig registrierte Segmente dürfen sich im Adressraum
      nicht überschneiden. POST /v1/segments für überlappendes Segment
      muss 409 mit CG-E-010.003 zurückgeben.
    precondition: T-API-046
    request:
      method: POST
      path: /v1/segments
      auth: bearer
      role: contributor
      body:
        owner_id: "overlap.test"
        parent_id: "{SEGMENT_ID_FROM_T_API_046}"
        size_ns: "999999999999999"
        level: 4
        start_hint: "{START_ADDRESS_FROM_T_API_046}"
    expect:
      status: 409
      body:
        error:
          cg_code: { const: "CG-E-010.003" }
    invariants: [I-SEG-1]
    normref: "CG-STD-4100 Kap. 4.6, CG-STD-6100 §3.5, I-SEG-1 (Th. 5.5)"

  - id: T-API-048
    level: 3
    group: segments
    title: "CGUA-Adresse auflösen: korrektes Segment"
    description: >
      GET /v1/segments/resolve/{cgua} für eine Adresse innerhalb des
      registrierten Segments muss das korrekte Segment zurückgeben.
    precondition: T-API-046
    request:
      method: GET
      path: "/v1/segments/resolve/{MID_CGUA_FROM_T_API_046}"
      auth: bearer
      role: reader
    expect:
      status: 200
      body:
        segment_id: { const: "{SEGMENT_ID_FROM_T_API_046}" }
        owner_id: { const: "test.chronogrid.org" }
        local_offset: { type: string, pattern: "^[0-9]+$" }
    invariants: [I-SEG-1]
    normref: "CG-STD-4100 Kap. 4.6"

