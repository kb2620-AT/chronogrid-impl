  # ── FILES / CGFS ───────────────────────────────────────────────────────────

  - id: T-API-052
    level: 3
    group: files
    title: "Datei-Manifest speichern: 201 mit korrektem CGFI"
    description: >
      POST /v1/files muss 201 zurückgeben und ein CGFI berechnen:
      SHA-256(TAI-ns ‖ ContentHash ‖ Typ-ID ‖ Seq).
    request:
      method: POST
      path: /v1/files
      auth: bearer
      role: contributor
      body:
        tai_timestamp_ns: "{tai_value_1}"
        content_hash: "{test_file_content_hash}"
        type_id: "application/pdf"
        seq: 0
    expect:
      status: 201
      body:
        cgfi: { const: "{test_cgfi}" }
        tai_timestamp_ns: { const: "{tai_value_1}" }
        content_hash: { const: "{test_file_content_hash}" }
        deleted_at: { const: null }
    invariants: [I-R3]
    normref: "CG-STD-4100 Kap. 4.7, CG-STD-3100 §5.4"

  - id: T-API-053
    level: 3
    group: files
    title: "Datei-Manifest abrufen per CGFI"
    precondition: T-API-052
    request:
      method: GET
      path: "/v1/files/{test_cgfi}"
      auth: bearer
      role: reader
    expect:
      status: 200
      body:
        cgfi: { const: "{test_cgfi}" }
        deleted_at: { const: null }
    invariants: []
    normref: "CG-STD-4100 Kap. 4.7"

  - id: T-API-054
    level: 3
    group: files
    title: "DSGVO Art. 17 Tombstone: deleted_at gesetzt, CGFI erhalten"
    description: >
      DELETE /v1/files/{cgfi} setzt deleted_at und deleted_reason.
      CGFI und content_hash bleiben erhalten (I-S1 — kein physisches Löschen).
      Nachfolgendes GET muss Tombstone zurückgeben (deleted_at nicht null).
    precondition: T-API-052
    request:
      method: DELETE
      path: "/v1/files/{test_cgfi}"
      auth: bearer
      role: contributor
      body:
        deleted_reason: "GDPR Art.17 Test"
    expect:
      status: 200
      body:
        cgfi: { const: "{test_cgfi}" }
        deleted_at: { pattern: "^CG:TAI:[0-9]+/v[0-9]+$" }
        deleted_reason: { const: "GDPR Art.17 Test" }
        content_hash: { const: "{test_file_content_hash}" }
    invariants: [I-S1]
    normref: "CG-STD-4100 Kap. 4.7, DSGVO Art. 17, I-S1 (Th. 5.3)"

