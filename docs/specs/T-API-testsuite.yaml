  - id: T-API-058
    level: 3
    group: conformance
    title: "Alle Level-2-Tests bestanden"
    type: aggregate
    requires:
      - suite: T-API
        range: [16, 45]
        min_pass: 30
    invariants: []
    normref: "CG-STD-5100 §4.3"

  - id: T-API-059
    level: 3
    group: performance
    title: "Performance: >= 1000 Zeitpunkte/s via REST"
    description: >
      Referenzimplementierung erreicht 288.564 Zeitpunkte/s (CG-BENCH-001).
      Level-3-Minimum: 1.000 Zeitpunkte/s auf Standard-Hardware.
      Test: 10.000 sequenzielle POST /v1/timepoints (Batch à 1000).
    type: performance
    config:
      total_timepoints: 10000
      batch_size: 1000
      timeout_seconds: 60
    expect:
      throughput_per_second: { minimum: 1000 }
      error_rate: { maximum: 0.0 }
    invariants: [I-R3]
    normref: "CG-STD-4100 Kap. 9 (Level 3), CG-BENCH-001"

  - id: T-API-060
    level: 3
    group: conformance
    title: "Geo-Redundanz: mindestens 2 unabhängige Storage-Regionen"
    description: >
      Level 3 erfordert Geo-Redundanz (CG-STD-4100 Kap. 9).
      GET /v1/health auf mindestens 2 Endpoints muss unterschiedliche
      storage_region Werte zurückgeben. Beide müssen status: ok haben.
    type: infrastructure
    note: >
      Erfordert REPLICA_ENDPOINT_URL als Umgebungsvariable.
      Nur ausführbar wenn zwei getrennte Registry-Instanzen verfügbar sind.
    expect:
      primary:
        status: { const: ok }
        storage_region: { type: string }
      replica:
        status: { const: ok }
        storage_region: { type: string, not_equal_to: "{PRIMARY_STORAGE_REGION}" }
    invariants: []
    normref: "CG-STD-4100 Kap. 9 (Level 3), CG-STD-5100 §4.3"


